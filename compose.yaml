name: event-tracking

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics_local
      POSTGRES_DB: analytics
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "analytics", "-d", "analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:59092:29092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analytics.event --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analytics.event.dlq.v1 --partitions 1 --replication-factor 1 --config retention.ms=1209600000

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analytics.corpus.status --partitions 1 --replication-factor 1 --config retention.ms=604800000

        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic analytics.dashboard.updated.v1 --partitions 1 --replication-factor 1 --config retention.ms=86400000

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics_local
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:58123:8123"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./backend/src/ipaklink_analytics/infrastructure/schema/clickhouse/bootstrap/001_events.sql:/docker-entrypoint-initdb.d/001_events.sql:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user=analytics", "--password=analytics_local", "--query=SELECT 1 FROM analytics.events_raw LIMIT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:57017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (db.adminCommand({ping: 1}).ok !== 1) quit(1)"]
      interval: 4s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["mongosh", "--host", "mongo", "--quiet", "--eval"]
    command:
      - |
        try { rs.status() } catch (error) {
          if (error.code !== 94) throw error;
          const result = rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
          if (result.ok !== 1) throw new Error("Replica-set initialization failed");
        }
        for (let attempt = 0; attempt < 30; attempt += 1) {
          if (db.hello().isWritablePrimary) quit(0);
          sleep(1000);
        }
        quit(1);

  migrate:
    build: ./backend
    environment:
      ANALYTICS_POSTGRES_DSN: postgresql://analytics:analytics_local@postgres:5432/analytics
      ANALYTICS_CLICKHOUSE_HOST: clickhouse
      ANALYTICS_CLICKHOUSE_PORT: 8123
      ANALYTICS_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    command: ["python", "-m", "ipaklink_analytics.infrastructure.schema.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

  object-storage:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: analytics-local
      MINIO_ROOT_PASSWORD: analytics-local-storage
    volumes: ["export-objects:/data"]

  object-storage-init:
    build: ./backend
    command: ["python", "-m", "ipaklink_analytics.infrastructure.export_objects"]
    environment: &export-environment
      ANALYTICS_EXPORT_BUCKET: analytics-exports
      ANALYTICS_EXPORT_S3_ENDPOINT: http://object-storage:9000
      ANALYTICS_EXPORT_S3_ACCESS_KEY: analytics-local
      ANALYTICS_EXPORT_S3_SECRET_KEY: analytics-local-storage
    depends_on:
      object-storage:
        condition: service_started

  api:
    build: ./backend
    environment: &api-environment
      <<: *export-environment
      ANALYTICS_POSTGRES_DSN: postgresql://analytics:analytics_local@postgres:5432/analytics
      ANALYTICS_REDIS_URL: redis://redis:6379/0
      ANALYTICS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYTICS_CLICKHOUSE_HOST: clickhouse
      ANALYTICS_CLICKHOUSE_PORT: 8123
      ANALYTICS_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      ANALYTICS_SIGNING_SECRET: ${ANALYTICS_SIGNING_SECRET:?Set ANALYTICS_SIGNING_SECRET in .env}
      ANALYTICS_APP_JWT_SECRET: ${ANALYTICS_APP_JWT_SECRET:-}
      ANALYTICS_APP_JWT_ISSUER: ${ANALYTICS_APP_JWT_ISSUER:-}
      ANALYTICS_APP_JWT_AUDIENCE: ${ANALYTICS_APP_JWT_AUDIENCE:-}
      ANALYTICS_ADMIN_ORIGIN: ${ANALYTICS_ADMIN_ORIGIN:-http://127.0.0.1:58000}
      ANALYTICS_ENVIRONMENT: ${ANALYTICS_ENVIRONMENT:-local}
    ports: ["127.0.0.1:58000:8000"]
    volumes: ["api-logs:/app/logs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  jobs:
    build: ./backend
    command: ["python", "-m", "ipaklink_analytics.application.job_worker"]
    restart: on-failure
    environment:
      <<: *api-environment
      ANALYTICS_JOB_API_ORIGIN: http://api:8000
      ANALYTICS_QUALITY_LAG_THRESHOLD: ${ANALYTICS_QUALITY_LAG_THRESHOLD:-1000}
    volumes: ["api-logs:/app/logs"]
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      api:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  consumer:
    build: ./backend
    command: ["python", "-m", "ipaklink_analytics.consumer"]
    restart: on-failure
    environment:
      ANALYTICS_POSTGRES_DSN: postgresql://analytics:analytics_local@postgres:5432/analytics
      ANALYTICS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ANALYTICS_CLICKHOUSE_HOST: clickhouse
      ANALYTICS_CLICKHOUSE_PORT: 8123
      ANALYTICS_SIGNING_SECRET: ${ANALYTICS_SIGNING_SECRET:?Set ANALYTICS_SIGNING_SECRET in .env}
    volumes: ["api-logs:/app/logs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  clickhouse-data:
  mongo-data:
  api-logs:
  export-objects:

